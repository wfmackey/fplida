on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # `enablement: true` lets the workflow turn Pages on itself. Without it
      # this step fails with "Get Pages site failed ... Not Found" on a
      # repository where Pages has never been configured, which is what
      # happened on the first run after merging to main.
      #
      # Pages also needs the repository to be public, or a paid plan. On a
      # free account with a private repository this step will still fail —
      # that is a repository setting, not something the workflow can fix.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
