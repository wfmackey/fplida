on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A topic that is exported but absent from `_pkgdown.yml` aborts the site
  # build, and the build below only runs once a branch is on main -- so the
  # first sign of the mistake has been a red main after review. This job runs
  # on the pull request instead. The reference index is read from DESCRIPTION,
  # man/ and vignettes/ in the checkout, so it needs no compiled package: no
  # Rust toolchain, no dependency solve, well under a minute.
  check-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Deliberately not setup-r-dependencies: that resolves this package's
      # own imports, which is the expensive part and the part that has broken
      # before. pkgdown alone is all the check needs.
      - name: Install pkgdown
        run: install.packages("pkgdown")
        shell: Rscript {0}

      - name: Check the pkgdown config
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

  pkgdown:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::./fplida.info, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Pages must already be enabled on the repository for this step to work.
      # `enablement: true` does NOT achieve that from inside a workflow:
      # creating a Pages site needs repository-admin rights, which the job's
      # GITHUB_TOKEN never has regardless of the `permissions:` block above, so
      # the call fails with "Create Pages site failed ... Resource not
      # accessible by integration". The option is kept only because it is a
      # harmless no-op once the site exists.
      #
      # To enable Pages once, as a repository admin:
      #   gh api repos/OWNER/REPO/pages -X POST -f build_type=workflow
      # or Settings -> Pages -> Source: GitHub Actions.
      #
      # Pages additionally requires the repository to be public, or a paid
      # plan. Both conditions are repository settings the workflow cannot fix.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
