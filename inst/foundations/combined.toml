# Combined Demographics – Indigenous Status
# Source: ABS Census 2021, ABS Estimates of Aboriginal and Torres Strait
#         Islander Australians (3238.0)
#
# The COMBINED dataset provides a best-estimate Indigenous status flag
# derived by combining information across multiple administrative sources
# (Census, DOMINO, HE, etc.). In fplida we project directly from the
# spine indigenous attribute.

[metadata]
dataset = "COMBINED"
agency = "ABS"
custodian = "Multiple"
reference_period = "2006 to latest"
update_frequency = "Annual"

[targets]
# ABS ERP Indigenous population, June 2021: 984,000 (~3.8% of 25.7M)
indigenous_share = 0.038
# Of Indigenous: ~91% Aboriginal only, ~5% TSI only, ~4% both
aboriginal_only_share = 0.91
tsi_only_share = 0.05
both_share = 0.04

# The spine now draws a latent Indigenous status and then decides separately
# whether the person stated it, at the rate below. The ABS reports INGP
# non-response of 6.0% at 2016 and 4.9% at 2021; 4.0 is the figure
# inst/foundations/census_2021.toml already carries for the same category, and
# the spine uses it so the two are not out of step. The weights are not
# compensated for it, so the OBSERVED Indigenous share falls, against the
# 0.038 target above. That is the honest response model: the observed share
# falls in the real Census too, before imputation.
#
# Measured on a 100,000-person direct-path spine at seed 42: not stated 3.97%,
# Indigenous (codes 2 to 4) 3.54%.
not_stated_share = 0.04
observed_indigenous_share = 0.0354
