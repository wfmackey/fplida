# ============================================================================
# Foundational Statistics for 2021 Census of Population and Housing
# ============================================================================
#
# Source: Australian Bureau of Statistics, 2021 Census
# URL: https://www.abs.gov.au/census/find-census-data/quickstats/2021/AUS
#       https://www.abs.gov.au/statistics/people/people-and-communities/snapshot-australia/2021
#
# These distributions are used to generate simulated Census data that
# approximates the real 2021 Census. Weights are normalised at runtime.
#
# Population reference: 25,422,788 persons on Census night (10 Aug 2021)
# Dwellings reference:  10,852,208 private dwellings (9,275,217 occupied)
# Families reference:   6,730,187 families

[meta]
dataset = "CENSUS"
year = 2021
reference_population = 25_422_788
reference_dwellings = 10_852_208
reference_occupied_dwellings = 9_275_217
reference_families = 6_730_187
census_date = "2021-08-10"

