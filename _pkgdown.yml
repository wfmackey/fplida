url: https://wfmackey.github.io/fplida/

template:
  bootstrap: 5
  light-switch: true

development:
  mode: release

home:
  title: Synthetic PLIDA and BLADE data
  description: >
    Generate synthetic administrative, Census, and business data with complete
    DIL schema companions. Survey schemas are included. Their variables use
    the not_applicable value-support status.

navbar:
  structure:
    left: [intro, datasets, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: index.html
    datasets:
      text: Datasets and variables
      href: articles/datasets.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/wfmackey/fplida

articles:
- title: Datasets and variables
  navbar: ~
  desc: >
    Every dataset in the bundled Data Item List, with its products, tables and
    variables. Each variable carries its description, type, value domain, valid
    values, source and reference period.
  contents:
  - articles/datasets
  - starts_with("articles/dataset-")

reference:
- title: Build a dataset
  desc: The usual entry points.
  contents:
  - build_fplida
  - generate_spine

- title: Look up the metadata
  desc: >
    What a dataset holds, and what every variable means. These read the bundled
    registries and need no generated data.
  contents:
  - dataset_info
  - variable_info

- title: Output location
  contents:
  - set_data_path
  - get_data_path
  - fplida_version

- title: Generators
  desc: >
    One per PLIDA dataset, plus the BLADE module. Each projects its products
    from the shared person or business spine. Call `build_fplida()` instead
    unless you want a single dataset.
  contents:
  - starts_with("generate_")
  - -generate_spine

- title: Output and linkage utilities
  contents:
  - convert_parquet_dir_to_csv
  - write_agency_spine
  - build_spine_template
  - build_fplida_slice_worker

- title: internal
  contents:
  - fplida-package
  - rust-internals

footer:
  structure:
    left: developed_by
    right: built_with
